# =============================================================================
# BIGSHIELD AI - Docker Compose (PostgreSQL Service)
# Use this if you do not want to install PostgreSQL natively on your computer.
#
# Quick Start:
#   docker compose up -d postgres
#
# This will:
#   1. Start a PostgreSQL 15 container on port 5432
#   2. Create the 'bigshield' database
#   3. Automatically run database/schema.sql and database/seed.sql
# =============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bigshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bigshield
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - bigshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigshield"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bigshield_pgdata:
